# SageVatar web: the built SPA + reverse proxy to the API container (same origin, like dev).
# Port 80 = plain HTTP. Port 443 = HTTPS (self-signed LAN certificate from ./docker/certs) —
# browsers only allow the live camera on HTTPS (or localhost), so share the HTTPS address.

server {
  listen 80;
  server_name _;
  include /etc/nginx/conf.d/sagevatar-locations.inc;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /etc/nginx/certs/sagevatar.crt;
  ssl_certificate_key /etc/nginx/certs/sagevatar.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/conf.d/sagevatar-locations.inc;
}
